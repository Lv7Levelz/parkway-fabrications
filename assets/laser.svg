<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Fibre laser cutting">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0a141d"/><stop offset="1" stop-color="#102434"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#e4edf3"/><stop offset=".5" stop-color="#8898a2"/><stop offset="1" stop-color="#35434b"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2f9bff"/><stop offset="1" stop-color="#0f5dff"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6a00"/><stop offset=".6" stop-color="#ffb000"/><stop offset="1" stop-color="#fff7c8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
